[package]
name = "ZlackTrial"
version = "1.6.0"
description = "A lightweight Slack desktop client built with Tauri"
authors = ["sanguneo"]
edition = "2021"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png", "ico"] }
# The macOS bridge uses Tauri’s custom invoke API and Wry navigation delegate.
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
open = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2.5.9", features = ["serde"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "=4.11.7"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
